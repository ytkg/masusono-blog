services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RAILS_ENV: development
        BUNDLE_WITHOUT: ""
        BUNDLE_DEPLOYMENT: "0"
        INSTALL_DEV_TOOLS: "1"
    command: ./bin/rails server -b 0.0.0.0 -p 3000
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      BUNDLE_WITHOUT: ""
      BUNDLE_DEPLOYMENT: "0"
      BUNDLE_PATH: /usr/local/bundle
      RAILS_LOG_TO_STDOUT: "1"
    tty: true
    stdin_open: true

volumes:
  bundle_cache:
