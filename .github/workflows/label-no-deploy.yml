name: label-no-deploy

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

concurrency:
  group: no-deploy-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Never execute PR code with the base repository's write token.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const { reconcileLabel } = require('./.github/scripts/deploy-policy.cjs');
            await reconcileLabel({ github, context, core });
