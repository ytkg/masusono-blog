name: backend-rspec

on:
  push:
    branches:
      - main
    paths:
      - backend/app/**
      - "!backend/app/frontend/**"
      - backend/config/**
      - "!backend/config/vite.json"
      - backend/db/**
      - backend/lib/**
      - backend/spec/**
      - backend/Gemfile
      - backend/Gemfile.lock
      - backend/.ruby-version
      - backend/.rspec
      - backend/Rakefile
      - backend/package.json
      - backend/package-lock.json
      - backend/vite.config.ts
      - backend/config.ru
      - backend/bin/rails
      - backend/bin/rake
      - backend/bin/setup
      - .github/workflows/backend-rspec.yml
  pull_request:
    paths:
      - backend/app/**
      - "!backend/app/frontend/**"
      - backend/config/**
      - "!backend/config/vite.json"
      - backend/db/**
      - backend/lib/**
      - backend/spec/**
      - backend/Gemfile
      - backend/Gemfile.lock
      - backend/.ruby-version
      - backend/.rspec
      - backend/Rakefile
      - backend/package.json
      - backend/package-lock.json
      - backend/vite.config.ts
      - backend/config.ru
      - backend/bin/rails
      - backend/bin/rake
      - backend/bin/setup
      - .github/workflows/backend-rspec.yml

jobs:
  rspec:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsqlite3-dev sqlite3 libvips imagemagick libmagickcore-6.q16-7-extra fonts-noto-cjk fonts-noto-color-emoji

      - name: Prepare test database
        run: bin/rails db:prepare

      - name: Run RSpec
        run: bundle exec rspec
