name: frontend-prettier

on:
  push:
    branches:
      - main
    paths:
      - app/frontend/**
      - package.json
      - package-lock.json
      - .prettierrc.json
      - .prettierignore
      - .github/workflows/frontend-prettier.yml
  pull_request:
    paths:
      - app/frontend/**
      - package.json
      - package-lock.json
      - .prettierrc.json
      - .prettierignore
      - .github/workflows/frontend-prettier.yml

jobs:
  prettier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run format:check
