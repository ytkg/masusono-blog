name: configure-cloud-run-artifact-retention

on:
  push:
    branches: [main]
    paths:
      - .github/artifact-registry-cleanup-policy.json
      - .github/run-sources-lifecycle.json
      - .github/workflows/configure-cloud-run-artifact-retention.yml
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/332902117625/locations/global/workloadIdentityPools/github-actions/providers/masusono-blog
          service_account: gha-cloud-run-deployer@masusono.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - run: gcloud artifacts repositories set-cleanup-policies cloud-run-source-deploy --project masusono --location asia-northeast1 --policy .github/artifact-registry-cleanup-policy.json
      - run: gcloud storage buckets update gs://run-sources-masusono-asia-northeast1 --lifecycle-file .github/run-sources-lifecycle.json
