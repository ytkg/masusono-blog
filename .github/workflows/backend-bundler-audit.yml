name: backend-bundler-audit

on:
  push:
    branches:
      - main
    paths:
      - backend/Gemfile
      - backend/Gemfile.lock
      - backend/.ruby-version
      - backend/config/bundler-audit.yml
      - backend/bin/bundler-audit
      - .github/workflows/backend-bundler-audit.yml
  pull_request:
    paths:
      - backend/Gemfile
      - backend/Gemfile.lock
      - backend/.ruby-version
      - backend/config/bundler-audit.yml
      - backend/bin/bundler-audit
      - .github/workflows/backend-bundler-audit.yml

jobs:
  bundler-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Run bundler-audit
        run: bin/bundler-audit
