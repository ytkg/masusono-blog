name: backend-bundler-audit

on:
  push:
    branches:
      - main
    paths:
      - Gemfile
      - Gemfile.lock
      - .ruby-version
      - config/bundler-audit.yml
      - bin/bundler-audit
      - .github/workflows/backend-bundler-audit.yml
  pull_request:
    paths:
      - Gemfile
      - Gemfile.lock
      - .ruby-version
      - config/bundler-audit.yml
      - bin/bundler-audit
      - .github/workflows/backend-bundler-audit.yml

jobs:
  bundler-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: .

      - name: Run bundler-audit
        run: bin/bundler-audit
