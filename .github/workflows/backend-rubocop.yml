name: backend-rubocop

on:
  push:
    branches:
      - main
    paths:
      - "**/*.rb"
      - Gemfile
      - Gemfile.lock
      - .ruby-version
      - .rubocop.yml
      - Rakefile
      - config.ru
      - bin/rubocop
      - .github/workflows/backend-rubocop.yml
  pull_request:
    paths:
      - "**/*.rb"
      - Gemfile
      - Gemfile.lock
      - .ruby-version
      - .rubocop.yml
      - Rakefile
      - config.ru
      - bin/rubocop
      - .github/workflows/backend-rubocop.yml

jobs:
  rubocop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: .

      - name: Run RuboCop
        run: bin/rubocop
