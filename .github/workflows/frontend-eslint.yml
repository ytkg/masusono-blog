name: frontend-eslint

on:
  push:
    branches:
      - main
    paths:
      - app/frontend/**
      - package.json
      - package-lock.json
      - eslint.config.mjs
      - .github/workflows/frontend-eslint.yml
  pull_request:
    paths:
      - app/frontend/**
      - package.json
      - package-lock.json
      - eslint.config.mjs
      - .github/workflows/frontend-eslint.yml

jobs:
  eslint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
