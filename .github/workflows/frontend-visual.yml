name: frontend-visual

on:
  push:
    branches:
      - main
    paths:
      - backend/app/frontend/**
      - backend/app/controllers/**
      - backend/app/models/**
      - backend/app/usecases/**
      - backend/app/views/**
      - backend/config/routes.rb
      - backend/config/environments/development.rb
      - backend/config/initializers/visual_test_fixtures.rb
      - backend/test/visual/**
      - backend/compose.yml
      - backend/compose.visual.yml
      - backend/playwright.config.js
      - backend/package.json
      - backend/package-lock.json
      - backend/vite.config.ts
      - .github/workflows/frontend-visual.yml
  pull_request:
    paths:
      - backend/app/frontend/**
      - backend/app/controllers/**
      - backend/app/models/**
      - backend/app/usecases/**
      - backend/app/views/**
      - backend/config/routes.rb
      - backend/config/environments/development.rb
      - backend/config/initializers/visual_test_fixtures.rb
      - backend/test/visual/**
      - backend/compose.yml
      - backend/compose.visual.yml
      - backend/playwright.config.js
      - backend/package.json
      - backend/package-lock.json
      - backend/vite.config.ts
      - .github/workflows/frontend-visual.yml

jobs:
  screenshots:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Start visual test server
        run: docker compose -f backend/compose.yml -f backend/compose.visual.yml up --build -d backend vite
      - name: Compare screenshots
        run: docker compose -f backend/compose.yml -f backend/compose.visual.yml run --rm visual
      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: |
            backend/test-results
            backend/playwright-report
          if-no-files-found: ignore
      - name: Stop visual test server
        if: always()
        run: docker compose -f backend/compose.yml -f backend/compose.visual.yml down
