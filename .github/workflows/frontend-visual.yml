name: frontend-visual

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  push-gate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Validate checked push scripts
        run: |
          bash -n scripts/check-visual.sh scripts/push.sh
          python3 scripts/test_visual_gate.py

  screenshots:
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
        shard: [1, 2]
    runs-on: ubuntu-24.04-arm
    env:
      COMPOSE_PROJECT_NAME: masusono-visual
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build visual test images
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./compose.yml
            ./compose.visual.yml
          targets: backend,visual
          load: true
          set: |
            backend.tags=masusono-visual-backend
            visual.tags=masusono-visual-visual
            backend.cache-from=type=gha,scope=frontend-visual-backend-${{ matrix.project }}-${{ matrix.shard }}
            backend.cache-to=type=gha,scope=frontend-visual-backend-${{ matrix.project }}-${{ matrix.shard }},mode=max
            visual.cache-from=type=gha,scope=frontend-visual-browser-${{ matrix.project }}-${{ matrix.shard }}
            visual.cache-to=type=gha,scope=frontend-visual-browser-${{ matrix.project }}-${{ matrix.shard }},mode=max
      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: tmp/npm-cache
          key: visual-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            visual-npm-${{ runner.os }}-${{ runner.arch }}-
      - name: Start visual test server
        run: docker compose -f compose.yml -f compose.visual.yml up --no-build -d backend vite
      - name: Compare screenshots
        run: docker compose -f compose.yml -f compose.visual.yml run --rm visual npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-results-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
      - name: Stop visual test server
        if: always()
        run: docker compose -f compose.yml -f compose.visual.yml down --timeout 1
