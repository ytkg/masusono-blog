name: playwright-e2e

on:
  push:
    branches:
      - main
    paths:
      - backend/app/**
      - backend/config/**
      - backend/db/**
      - backend/lib/**
      - backend/e2e/**
      - backend/Gemfile
      - backend/Gemfile.lock
      - backend/.ruby-version
      - backend/package.json
      - backend/package-lock.json
      - backend/vite.config.ts
      - backend/playwright.config.js
      - backend/config.ru
      - backend/bin/rails
      - backend/bin/setup
      - backend/bin/e2e-rails-server
      - backend/bin/e2e-vite-server
      - .github/workflows/playwright-e2e.yml
  pull_request:
    paths:
      - backend/app/**
      - backend/config/**
      - backend/db/**
      - backend/lib/**
      - backend/e2e/**
      - backend/Gemfile
      - backend/Gemfile.lock
      - backend/.ruby-version
      - backend/package.json
      - backend/package-lock.json
      - backend/vite.config.ts
      - backend/playwright.config.js
      - backend/config.ru
      - backend/bin/rails
      - backend/bin/setup
      - backend/bin/e2e-rails-server
      - backend/bin/e2e-vite-server
      - .github/workflows/playwright-e2e.yml

jobs:
  playwright-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsqlite3-dev sqlite3 libvips

      - name: Prepare application environment
        run: bin/setup --skip-server

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e
