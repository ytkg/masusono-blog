name: backend-brakeman

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - "!app/frontend/**"
      - config/**
      - "!config/vite.json"
      - db/**
      - lib/**
      - Gemfile
      - Gemfile.lock
      - .ruby-version
      - config.ru
      - bin/brakeman
      - .github/workflows/backend-brakeman.yml
  pull_request:
    paths:
      - app/**
      - "!app/frontend/**"
      - config/**
      - "!config/vite.json"
      - db/**
      - lib/**
      - Gemfile
      - Gemfile.lock
      - .ruby-version
      - config.ru
      - bin/brakeman
      - .github/workflows/backend-brakeman.yml

jobs:
  brakeman:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: .

      - name: Run Brakeman
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error
