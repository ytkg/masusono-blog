name: frontend-vitest

on:
  push:
    branches:
      - main
    paths:
      - app/frontend/**
      - test/ssr/**
      - package.json
      - package-lock.json
      - vite.config.ts
      - config/vite.json
      - .github/workflows/frontend-vitest.yml
  pull_request:
    paths:
      - app/frontend/**
      - test/ssr/**
      - package.json
      - package-lock.json
      - vite.config.ts
      - config/vite.json
      - .github/workflows/frontend-vitest.yml

jobs:
  vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

      - name: Verify production SSR bundle
        run: npm run test:ssr
