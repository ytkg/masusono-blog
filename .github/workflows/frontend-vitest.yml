name: frontend-vitest

on:
  push:
    branches:
      - main
    paths:
      - app/frontend/**
      - public/service-worker.js
      - test/ssr/**
      - package.json
      - package-lock.json
      - vite.config.ts
      - config/vite.json
      - .github/scripts/publish-coverage*.cjs
      - .github/workflows/publish-coverage.yml
      - .github/workflows/frontend-vitest.yml
  pull_request:
    paths:
      - app/frontend/**
      - public/service-worker.js
      - test/ssr/**
      - package.json
      - package-lock.json
      - vite.config.ts
      - config/vite.json
      - .github/scripts/publish-coverage*.cjs
      - .github/workflows/publish-coverage.yml
      - .github/workflows/frontend-vitest.yml

jobs:
  vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test coverage badge publication
        run: node --test .github/scripts/publish-coverage.test.cjs

      - name: Run Vitest
        run: npm run test:coverage

      - name: Verify production SSR bundle
        run: npm run test:ssr

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: coverage/frontend/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish-coverage:
    needs: vitest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-coverage.yml
    with:
      kind: frontend
