name: deploy-cloud-run

on:
  push:
    branches:
      - main
    paths:
      - '*'
      - app/**
      - bin/**
      - config/**
      - db/**
      - docs/**
      - lib/**
      - log/**
      - public/**
      - script/**
      - spec/**
      - storage/**
      - test/**
      - tmp/**
      - vendor/**
      - .github/workflows/deploy-cloud-run.yml
      - .github/scripts/deploy-policy.cjs

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.policy.outputs.result }}
    steps:
      - name: Read trusted deployment policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: deployment-policy
          persist-credentials: false

      - name: Decide whether to skip deployment
        id: policy
        uses: actions/github-script@v9
        with:
          script: |
            const { skipProduction } = require('./deployment-policy/.github/scripts/deploy-policy.cjs');
            return await skipProduction({ github, context, core });

  ci:
    needs: policy
    if: needs.policy.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: .

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsqlite3-dev sqlite3 libvips imagemagick libmagickcore-6.q16-7-extra fonts-noto-cjk fonts-noto-color-emoji

      - name: Install frontend dependencies
        run: npm ci

      - name: Run CI
        run: bin/ci

  build:
    needs: policy
    if: needs.policy.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_package: ${{ steps.deployment.outputs.image_package }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/332902117625/locations/global/workloadIdentityPools/github-actions/providers/masusono-blog
          service_account: gha-cloud-run-deployer@masusono.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve deployment names
        id: deployment
        env:
          DEPLOY_BRANCH: main
        run: ./deploy.sh service-name

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: asia-northeast1-docker.pkg.dev/masusono/cloud-run-source-deploy/${{ steps.deployment.outputs.image_package }}:${{ github.sha }}
          cache-from: type=gha,scope=cloud-run-backend
          cache-to: type=gha,scope=cloud-run-backend,mode=max,ignore-error=true

  deploy:
    needs: [ci, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/332902117625/locations/global/workloadIdentityPools/github-actions/providers/masusono-blog
          service_account: gha-cloud-run-deployer@masusono.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        env:
          IMAGE_URI: asia-northeast1-docker.pkg.dev/masusono/cloud-run-source-deploy/${{ needs.build.outputs.image_package }}:${{ github.sha }}
        run: ./deploy.sh
